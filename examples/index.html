<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>CRYChart · 交互实验室</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23172924'/%3E%3Cpath d='M23 9A10 10 0 1 0 23 23' fill='none' stroke='%2337dab5' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    :root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#e5e9ed;background:#101317;font-synthesis:none;--page:#101317;--panel:#171b20;--raised:#1d232a;--border:#2b333b;--muted:#96a2af;--text:#e5e9ed;--accent:#37dab5;--accent-soft:#193b35;--amber:#fcbd5e}
    *{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}button,a{touch-action:manipulation}a{color:var(--accent);text-underline-offset:3px}button{color:inherit}::selection{background:#276c5e;color:#fff}
    .topbar{height:78px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:20px;background:var(--page)}
    .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}.brand-mark{width:34px;height:34px;border:1px solid #3d7366;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#234e44,#142c28);color:var(--accent);font-weight:800;font-size:20px}.brand-name{font-size:21px;letter-spacing:-.8px;font-weight:750}.brand-caption{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-top:3px}.top-meta{display:flex;gap:22px;align-items:center;font-size:12px;color:var(--muted)}.local-badge{display:flex;gap:7px;align-items:center}.dot{width:6px;height:6px;border-radius:100%;background:var(--accent);display:inline-block}.top-link{color:var(--muted);text-decoration:none;border-bottom:1px solid #55616d;padding-bottom:2px}
    .layout{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:calc(100vh - 78px)}.sidebar{border-right:1px solid var(--border);padding:26px 18px 18px;background:#13171b;position:sticky;top:0;height:calc(100vh - 1px);overflow:auto}.eyebrow{font-size:10px;font-weight:650;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}.side-title{font-size:19px;font-weight:650;margin:8px 8px 20px}.side-title small{font-size:12px;font-weight:400;color:var(--muted);margin-left:7px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#0e1115;border:1px solid var(--border);padding:3px;border-radius:8px;gap:2px;margin-bottom:18px}.tab{border:0;background:transparent;border-radius:5px;padding:9px 3px;color:var(--muted);font-size:12px}.tab.active{background:var(--raised);color:var(--text);box-shadow:0 1px 3px #0008}
    .search-wrap{position:relative}.search-icon{position:absolute;left:12px;top:10px;color:#75828d}.search{width:100%;height:37px;background:#0f1317;border:1px solid var(--border);border-radius:6px;padding:0 10px 0 34px;color:var(--text);font-size:12px}.search:focus{border-color:var(--accent)}.category-select{width:100%;margin:9px 0 19px;padding:8px 9px;background:#171d23;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:12px}.list-count{font-size:10px;letter-spacing:1px;color:#8c99a6;margin:0 8px 10px}.demo-list{display:flex;flex-direction:column;gap:4px}.demo-link{width:100%;border:1px solid transparent;border-radius:7px;background:transparent;text-align:left;padding:12px 11px;display:flex;gap:11px;align-items:center}.demo-link:hover{background:#1c2228}.demo-link.active{background:#19332f;border-color:#2a5b4e}.demo-icon{width:27px;height:27px;display:grid;place-items:center;border:1px solid #35414a;border-radius:6px;flex-shrink:0;color:#9aa9b5;font-size:12px}.active .demo-icon{color:var(--accent);border-color:#37685c}.demo-name{font-size:12px;font-weight:550;line-height:1.5}.demo-category{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}.pending-dot{width:5px;height:5px;background:var(--amber);border-radius:50%;margin-left:auto;flex-shrink:0}.side-foot{margin:24px 8px 10px;font-size:10px;color:#7f8c98;line-height:1.8;border-top:1px solid var(--border);padding-top:16px}
    main{min-width:0;padding:32px 34px 28px;max-width:1800px;width:100%;margin:auto}.breadcrumb{font-size:11px;color:var(--muted);letter-spacing:.5px;display:flex;align-items:center;gap:9px;margin-bottom:18px}.breadcrumb span:last-child{color:#bbc5ce}.heading-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.headline{margin:0;font-size:29px;font-weight:650;letter-spacing:-.8px;line-height:1.3}.subhead{color:var(--muted);font-size:12px;line-height:1.9;max-width:800px;margin:12px 0 22px}.status-pill{white-space:nowrap;border:1px solid #3d5b51;background:#152d25;color:#94d6b4;border-radius:20px;padding:6px 10px;font-size:10px;display:inline-flex;align-items:center;gap:6px}.status-pill.pending{color:#e5bd82;background:#30291d;border-color:#51452f}.feature-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}.feature{font-size:10px;color:#a4b2be;background:#1a2026;border:1px solid #303a43;border-radius:4px;padding:5px 8px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;background:var(--panel);border:1px solid var(--border);border-bottom:0;padding:12px 15px;border-radius:10px 10px 0 0}.toolbar-title{font-size:10px;color:var(--muted);letter-spacing:1px;display:flex;align-items:center;gap:8px}.actions{display:flex;gap:7px;align-items:center}.button{border:1px solid #3a444e;border-radius:5px;background:#252c34;font-size:11px;padding:7px 12px;min-height:31px}.button:hover{border-color:#677581;background:#2c353e}.button.primary{color:#10241e;background:var(--accent);border-color:var(--accent);font-weight:650}.button.subtle{background:transparent;color:var(--muted)}.chart-stage{height:460px;min-height:340px;border:1px solid var(--border);position:relative;background:#10151a;overflow:hidden}.chart-stage.wide{height:650px}.chart-grid{display:grid;grid-template-rows:1fr;gap:1px;background:var(--border)}.chart-cell{position:relative;min-width:0;min-height:0;background:#10151a}.chart-stage canvas{display:block}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--border);border-top:0;background:var(--panel);border-radius:0 0 10px 10px}.stat{padding:14px 18px;border-right:1px solid var(--border)}.stat:last-child{border-right:0}.stat-label{font-size:9px;letter-spacing:.7px;color:var(--muted);margin-bottom:6px}.stat-value{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.5px;font-weight:550}.stat-value small{font-size:10px;color:var(--muted);font-weight:400;margin-left:4px}
    .bottom-grid{display:grid;grid-template-columns:minmax(240px,1.1fr) minmax(240px,1fr);gap:20px;margin-top:22px}.info-panel{border:1px solid var(--border);border-radius:9px;background:var(--panel);padding:18px 19px}.panel-heading{font-size:12px;letter-spacing:.3px;margin:0 0 17px;font-weight:600;display:flex;align-items:center;justify-content:space-between}.panel-heading small{font-size:9px;color:var(--muted);font-weight:400}.control{display:grid;grid-template-columns:83px minmax(0,1fr) 47px;gap:12px;align-items:center;margin:17px 0;font-size:11px}.control:first-of-type{margin-top:4px}.control-label{color:#adb7c1}.control input[type=range]{width:100%;accent-color:var(--accent);height:3px}.control select{grid-column:2/4;width:100%;background:#10151a;border:1px solid #39444e;border-radius:4px;padding:7px;color:var(--text);font-size:11px}.control-output{text-align:right;color:var(--text);font-variant-numeric:tabular-nums;font-size:11px}.panel-text{font-size:11px;line-height:1.9;color:var(--muted);margin:9px 0}.reference-links{display:flex;flex-wrap:wrap;gap:7px}.reference-link{font-family:Consolas,monospace;color:#b6c7ce;text-decoration:none;font-size:10px;background:#222a31;border:1px solid #34414a;border-radius:4px;padding:6px 7px}.reference-link:hover{color:var(--accent);border-color:var(--accent)}.limitation{font-size:11px;line-height:1.8;color:#d0b68e;border-left:2px solid #927148;padding:2px 0 2px 11px;margin:12px 0}.footnote{font-size:10px;color:#7f8d99;margin-top:21px;display:flex;justify-content:space-between;gap:15px;line-height:1.7}.reference-detail{border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:28px}.reference-id{font-family:Consolas,monospace;font-size:11px;word-break:break-all;color:var(--muted);margin-bottom:20px}.check-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:22px 0}.check-item{background:#20252b;border:1px solid var(--border);border-radius:7px;padding:15px 12px;font-size:11px}.check-item span{display:block;font-size:10px;color:#d0b68e;margin-top:10px}.reference-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.reference-actions .button{text-decoration:none;display:inline-flex;align-items:center}.empty{padding:38px 15px;text-align:center;color:var(--muted);font-size:12px;line-height:2}.chart-error{height:100%;display:flex;justify-content:center;flex-direction:column;padding:40px;gap:15px;color:#e2bc99;background:#211d1a;font-size:12px;line-height:1.8}.chart-error strong{font-size:20px}.chart-error code{white-space:pre-wrap;overflow-wrap:anywhere;color:#c1b4aa}.mobile-toggle{display:none}.hidden{display:none!important}.loading{padding:60px;color:var(--muted);text-align:center;font-size:13px}
    body.light{--page:#f2f4f2;--panel:#fff;--raised:#e5ebe6;--border:#d3ddd5;--muted:#5f7067;--text:#223a2d;--accent:#187a61;background:var(--page);color:var(--text)}body.light .sidebar{background:#eaf0eb}body.light .demo-link.active{background:#d8ece2}body.light .tabs,body.light .search,body.light .category-select{background:#fff;color:var(--text)}body.light .feature,body.light .reference-link{background:#e5eee8;color:#3b6250}body.light .button{background:#e7eee9;color:#274b39;border-color:#bccfc2}body.light .button.primary{background:#187a61;color:#fff}body.light .control select{background:#f2f6f3;color:#243c2e}body.light .check-item{background:#edf2ee}
    @media(min-width:1600px){.chart-stage{height:560px}main{padding-left:44px;padding-right:44px}}@media(max-width:1100px){.layout{grid-template-columns:245px minmax(0,1fr)}main{padding:26px 22px}.sidebar{padding:24px 13px}.bottom-grid{grid-template-columns:1fr}.headline{font-size:25px}.stat{padding:13px 12px}.stat-value{font-size:17px}.topbar{padding:0 22px}.top-meta{gap:12px}}@media(max-width:760px){.layout{display:block}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border);padding:14px 18px}.side-title,.side-foot{display:none}.demo-list{max-height:200px;overflow:auto}.sidebar.collapsed .side-content{display:none}.mobile-toggle{display:block}.topbar{height:68px;padding:0 18px}.top-meta .local-badge,.top-meta .top-link{display:none}.brand-caption{font-size:9px}.brand-name{font-size:19px}main{padding:24px 18px}.heading-row{gap:10px}.headline{font-size:23px}.status-pill{font-size:9px;padding:5px 7px}.subhead{font-size:11px}.chart-stage{height:400px}.chart-grid{grid-template-columns:1fr!important;grid-template-rows:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--border)}.toolbar{padding:10px}.button{padding:7px 8px}.bottom-grid{gap:14px}.check-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.footnote{display:block}.reference-detail{padding:20px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#demo=stream" aria-label="CRYChart 首页"><span class="brand-mark">C</span><span><span class="brand-name">CRYChart</span><div class="brand-caption">Interactive Laboratory</div></span></a>
    <div class="top-meta"><a class="top-link" href="/examples/channel-lab/index.html">128 通道波形 ↗</a><a class="top-link" href="/examples/opentest-lab/index.html">OpenTest 图表 ↗</a><a class="top-link" href="/examples/official/index.html">图表场景 ↗</a><button id="theme-button" class="button subtle" aria-label="切换主题">浅色</button><button id="menu-button" class="button mobile-toggle" aria-expanded="false">示例</button></div>
  </header>
  <div class="layout">
    <aside id="sidebar" class="sidebar collapsed" aria-label="示例导航">
      <div class="side-title">探索图表 <small id="recipe-total"></small></div>
      <div class="side-content">
        <div class="tabs" role="tablist" aria-label="目录类型"><button id="recipes-tab" class="tab active" role="tab" aria-selected="true">原创演示</button><button id="references-tab" class="tab" role="tab" aria-selected="false">场景清单 · 167</button></div>
        <div class="search-wrap"><span class="search-icon" aria-hidden="true">⌕</span><input id="search" class="search" type="search" placeholder="搜索名称、能力或编号" aria-label="搜索示例"></div>
        <select id="category" class="category-select" aria-label="按分类筛选"><option value="">全部分类</option></select>
        <div id="list-count" class="list-count"></div><nav id="demo-list" class="demo-list" aria-label="示例列表"></nav>
        <div class="side-foot">独立数据 · 原生实现<br>场景运行与生产容量分别验证。</div>
      </div>
    </aside>
    <main id="main"><div class="loading">正在加载交互实验室…</div></main>
  </div>
  <script type="module" src="/dist/gallery.js"></script>
</body>
</html>
